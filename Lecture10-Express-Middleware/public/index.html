<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact Form</title>
</head> 
<body>
  <h1>Contact Us</h1>
  <p>This page is a static file served by express.static from the "public" folder.</p>

  <form id="contactForm">
    <p><input name="name" placeholder="Your name" required></p>
    <p><textarea name="message" placeholder="Your message" required></textarea></p>
    <button type="submit">Send</button>
  </form>

  <pre id="result"></pre>

  <script>
    // Send the form as JSON to the POST /contact route
    document.getElementById("contactForm").addEventListener("submit", async (event) => {
      event.preventDefault();
      const data = Object.fromEntries(new FormData(event.target));
      const response = await fetch("/contact", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(data),
      });
      document.getElementById("result").textContent = response.status + " " + JSON.stringify(await response.json(), null, 2);
    });
  </script> 
</body>
</html>
